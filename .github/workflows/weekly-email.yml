name: Weekly tango email
on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC = 9:00 AM EDT (8:00 AM EST after Nov 1)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (1) or really send (0)"
        default: "1"
      to:
        description: "Recipient (blank = tangoannouncements list)"
        default: ""
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Refresh events (from the BoilerLink RSS feed)
        env: { FEED_URL: "${{ secrets.FEED_URL || 'https://boilerlink.purdue.edu/events.rss' }}" }
        run: python scripts/sync_events.py
      - name: Commit refreshed events
        run: |
          git config user.name "tango-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/events.js; git diff --cached --quiet || (git commit -m "Update events" && git push)
      - name: Generate and send emails
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          MODE: per_event
          TO_ADDR: ${{ github.event.inputs.to || 'tangoannouncements@lists.purdue.edu' }}
        run: python scripts/send_weekly.py
      - uses: actions/upload-artifact@v4
        with: { name: email-previews, path: out/ }
